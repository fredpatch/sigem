services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-sigem/api-gateway:onprem}
    build:
      context: ../../..
      dockerfile: infra/docker/api-gateway.Dockerfile
    container_name: sigem-onprem-api-gateway
    restart: unless-stopped
    env_file:
      - ./.env.onprem
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      NOTIF_SERVICE_URL: ${NOTIF_SERVICE_URL:-http://notification-service:4001}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:4002}
      VEHICLE_SERVICE_URL: ${VEHICLE_SERVICE_URL:-http://vehicle-service:4003}
      REFERENCE_SERVICE_URL: ${REFERENCE_SERVICE_URL:-http://reference-service:4006}
      PROVIDER_SERVICE_URL: ${PROVIDER_SERVICE_URL:-http://provider-service:4010}
    ports:
      - "0.0.0.0:${API_GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4000/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      mongo:
        condition: service_healthy
      vehicle-service:
        condition: service_healthy
    networks:
      - sigem-onprem
