map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver.
    # Setting upstreams as variables defers hostname resolution to request time,
    # so nginx starts even if a service (e.g. notification-service) is absent.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the gateway (avoids CORS in browser)
    location /api/ {
        set $gateway http://api-gateway:4000;
        rewrite ^/api/v1/(.*)$ /v1/$1 break;
        rewrite ^/api/(.*)$ /v1/$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.io to notification-service
    location /socket.io/ {
        set $notif http://notification-service:4001;
        proxy_pass $notif;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # SPA fallback — all unknown paths serve index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
